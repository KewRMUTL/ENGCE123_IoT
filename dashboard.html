<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ประวัติการเข้า-ออก - Resident Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f8f9fa; }
        .navbar-brand { font-weight: bold; }
    </style>
</head>
<body>

    <!-- Navbar ฝั่ง User (ไม่มีคำว่า Admin) -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand" href="dashboard.html">🚘 Resident System</a>
            <div class="d-flex align-items-center gap-3">
                <a href="profile.html" class="btn btn-outline-light">ข้อมูลส่วนตัว</a>
                <button onclick="logout()" class="btn btn-danger btn-sm">ออกจากระบบ</button>
            </div>
        </div>
    </nav>

    <div class="container">
        <!-- Header -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h4 class="fw-bold mb-1">ประวัติการเข้า-ออกโครงการ</h4>
                <p class="text-muted small mb-0">แสดงเฉพาะรายการตรวจจับประเภท: <span class="badge bg-success">รถยนต์ (Car)</span></p>
            </div>
            <span id="houseBadge" class="badge bg-primary fs-6 px-3 py-2">บ้านเลขที่: --</span>
        </div>

        <!-- ตารางข้อมูลเฉพาะรถยนต์ -->
        <div class="card border-0 shadow-sm rounded-3">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0 text-center">
                        <thead class="table-light">
                            <tr>
                                <th>ภาพถ่าย</th>
                                <th>ทะเบียนรถ</th>
                                <th>ประเภทรถ</th>
                                <th>เวลา เข้า-ออก</th>
                                <th>สถานะ</th>
                            </tr>
                        </thead>
                        <tbody id="carHistoryData">
                            <!-- ตัวอย่าง ข้อมูลรถยนต์เท่านั้น -->
                            <tr>
                                <td><img src="https://via.placeholder.com/80x50" class="rounded border" alt="Car Image"></td>
                                <td class="fw-bold">1กข 8888 กรุงเทพฯ</td>
                                <td><span class="badge bg-info text-dark">รถยนต์ (Car)</span></td>
                                <td>2026-08-03 18:20:15</td>
                                <td><span class="badge bg-success">ขาเข้า (IN)</span></td>
                            </tr>
                            <tr>
                                <td><img src="https://via.placeholder.com/80x50" class="rounded border" alt="Car Image"></td>
                                <td class="fw-bold">2กง 1234 เชียงใหม่</td>
                                <td><span class="badge bg-info text-dark">รถยนต์ (Car)</span></td>
                                <td>2026-08-03 08:15:00</td>
                                <td><span class="badge bg-warning text-dark">ขาออก (OUT)</span></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ดึงข้อมูล Session และป้องกันการเข้าหน้าโดยไม่ล็อกอิน
        const session = JSON.parse(localStorage.getItem('user_session'));
        if(!session) {
            window.location.href = "index.html";
        } else {
            document.getElementById('houseBadge').innerText = "บ้านเลขที่: " + session.house_no;
        }

        function logout() {
            localStorage.removeItem('user_session');
            window.location.href = "index.html";
        }
    </script>
</body>
</html>
