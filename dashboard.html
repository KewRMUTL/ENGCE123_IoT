<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบจัดการข้อมูลลูกบ้าน</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-main: #fcf8ec;      /* สีพื้นหลังครีมเดิมของคุณ */
            --navy-dark: #0f2c59;    /* สีน้ำเงินเข้มเดิมของคุณ */
            --navy-light: #183d73;   /* สีน้ำเงินปุ่ม/แถบ */
        }
        
        body { 
            background-color: var(--bg-main); 
            font-family: sans-serif;
            margin: 0;
            padding: 0;
        }

        /* Layout Sidebar ตามโครงสร้างเดิม */
        .sidebar {
            width: 220px;
            background-color: var(--navy-dark);
            min-height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            color: white;
            padding-top: 20px;
        }

        .sidebar-logo {
            text-align: center;
            padding: 10px;
            margin-bottom: 20px;
        }

        .sidebar-menu a {
            display: block;
            color: white;
            text-decoration: none;
            padding: 12px 20px;
            font-weight: bold;
            font-size: 0.9rem;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .sidebar-menu a.active, .sidebar-menu a:hover {
            background-color: white;
            color: var(--navy-dark);
        }

        /* Main Content ด้านขวา */
        .main-content {
            margin-left: 220px;
            padding: 0;
        }

        .top-header {
            background-color: var(--navy-dark);
            color: white;
            text-align: center;
            padding: 15px;
            font-size: 1.5rem;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .content-body {
            padding: 30px;
        }

        /* Cards สรุปข้อมูล 3 กล่องด้านบน */
        .summary-card {
            background-color: var(--navy-dark);
            color: white;
            border-radius: 4px;
            padding: 25px 15px;
            text-align: center;
            height: 100%;
        }

        .summary-card h5 {
            font-size: 1.2rem;
            margin-bottom: 15px;
        }

        .summary-card .number {
            font-size: 2.5rem;
            font-weight: bold;
        }

        /* ตารางสไตล์เดิมของคุณ */
        .table-custom-header {
            background-color: var(--navy-dark);
            color: white;
            padding: 10px;
            text-align: center;
            font-weight: bold;
            border-radius: 4px;
            margin-bottom: 15px;
        }

        .data-row {
            background-color: var(--navy-dark);
            color: white;
            border-radius: 4px;
            padding: 10px 15px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .btn-custom-light {
            background-color: white;
            color: var(--navy-dark);
            border-radius: 20px;
            padding: 4px 20px;
            font-size: 0.85rem;
            font-weight: bold;
            border: none;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <!-- Sidebar ด้านซ้าย (ปรับเมนูให้เหลือเฉพาะของ User ตามผลประชุม) -->
    <div class="sidebar">
        <div class="sidebar-logo">
            <!-- โลโก้เดิมของคุณ -->
            <img src="logochicken.png" alt="Logo" style="width: 50px; filter: brightness(0) invert(1);">
        </div>
        <div class="sidebar-menu">
            <a href="dashboard.html" class="active">HOME</a>
            <a href="profile.html">USER DATA</a>
            <!-- ตัด VEHICLE DATA ออกตามสรุปประชุม -->
            <a href="#" onclick="logout()" style="margin-top: 50px; color: #ff6b6b;">LOGOUT</a>
        </div>
    </div>

    <!-- Main Content ฝั่งขวา -->
    <div class="main-content">
        <!-- แถบ Header สีน้ำเงินเข้ม ลบคำว่า Admin ออกแล้ว -->
        <div class="top-header">
            ระบบจัดการข้อมูลลูกบ้าน
        </div>

        <div class="content-body">
            <!-- กล่องสรุปข้อมูล 3 กล่องด้านบน (เข้า / ออก / สมาชิก) -->
            <div class="row g-4 mb-5">
                <div class="col-md-4">
                    <div class="summary-card">
                        <h5>เข้า</h5>
                        <div class="number" id="countIn">0</div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="summary-card">
                        <h5>ออก</h5>
                        <div class="number" id="countOut">0</div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="summary-card">
                        <h5>ประเภทสมาชิก</h5>
                        <div class="fs-4 mt-3" id="memberStatus">Active</div>
                    </div>
                </div>
            </div>

            <!-- หัวตาราง -->
            <div class="table-custom-header">
                ประวัติการเข้า-ออก (เฉพาะรถยนต์)
            </div>

            <!-- รายการตารางสไตล์สี่เหลี่ยมผืนผ้าสีน้ำเงินของคุณ -->
            <div id="logsContainer">
                <!-- ข้อมูลจะถูกโหลดจาก dataTest.json มาใส่ตรงนี้ -->
                <div class="text-center py-4 text-muted">กำลังโหลดข้อมูล...</div>
            </div>

        </div>
    </div>

    <script>
        // เช็คการล็อกอิน
        const session = JSON.parse(localStorage.getItem('user_session'));
        if (!session) {
            window.location.href = "index.html";
        } else {
            loadDashboardData(session.house_no);
        }

        function logout() {
            localStorage.removeItem('user_session');
            window.location.href = "index.html";
        }

        // ดึงข้อมูลจาก dataTest.json ให้ตรงกับเลย์เอาต์เดิม
        function loadDashboardData(targetHouseNo) {
            fetch('dataTest.json')
                .then(res => res.json())
                .then(data => {
                    const currentUser = data.find(u => u.houseNumber === targetHouseNo);
                    
                    if (currentUser) {
                        document.getElementById('memberStatus').innerText = currentUser.memberStatus || 'Active';
                        
                        let html = '';
                        let inCount = 0;
                        let outCount = 0;

                        currentUser.vehicles.forEach(vehicle => {
                            // กรองเฉพาะ รถยนต์ (Car) ตามสรุปประชุม
                            if (vehicle.type === "Car") {
                                vehicle.timeInOut.forEach(log => {
                                    if(log.in) inCount++;
                                    if(log.out) outCount++;

                                    html += `
                                        <div class="data-row">
                                            <div style="width: 25%;">${vehicle.plate}</div>
                                            <div style="width: 40%;">เข้า: ${log.in} | ออก: ${log.out || 'ยังไม่ออก'} (${log.date})</div>
                                            <div style="width: 15%;"><span class="badge bg-info">รถยนต์</span></div>
                                            <div>
                                                <a href="profile.html" class="btn-custom-light">แสดงข้อมูลเพิ่มเติม</a>
                                            </div>
                                        </div>
                                    `;
                                });
                            }
                        });

                        document.getElementById('countIn').innerText = inCount;
                        document.getElementById('countOut').innerText = outCount;
                        document.getElementById('logsContainer').innerHTML = html || '<div class="text-center py-3">ไม่พบข้อมูลประวัติรถยนต์</div>';
                    }
                });
        }
    </script>
</body>
</html>
