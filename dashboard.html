<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ประวัติการเข้า-ออก - Resident Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f8f9fa; font-family: 'Kanit', sans-serif; }
        .navbar-brand { font-weight: bold; }
    </style>
</head>
<body>

    <!-- Navbar ฝั่ง User -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand" href="dashboard.html">🚘 Resident System</a>
            <div class="d-flex align-items-center gap-3">
                <a href="profile.html" class="btn btn-outline-light btn-sm">ข้อมูลส่วนตัว</a>
                <button onclick="logout()" class="btn btn-danger btn-sm">ออกจากระบบ</button>
            </div>
        </div>
    </nav>

    <div class="container">
        <!-- Header -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h4 class="fw-bold mb-1">ประวัติการเข้า-ออกโครงการ</h4>
                <p class="text-muted small mb-0">แสดงเฉพาะรายการตรวจจับประเภท: <span class="badge bg-success">รถยนต์ (Car)</span></p>
            </div>
            <span id="houseBadge" class="badge bg-primary fs-6 px-3 py-2">บ้านเลขที่: --</span>
        </div>

        <!-- ตารางข้อมูลเฉพาะรถยนต์ -->
        <div class="card border-0 shadow-sm rounded-3">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0 text-center">
                        <thead class="table-light">
                            <tr>
                                <th>ภาพถ่าย</th>
                                <th>ทะเบียนรถ</th>
                                <th>ประเภทรถ</th>
                                <th>เวลา เข้า-ออก</th>
                                <th>ประตูทางเข้า/ออก</th>
                            </tr>
                        </thead>
                        <tbody id="carHistoryData">
                            <tr>
                                <td colspan="5" class="py-4 text-muted">กำลังโหลดข้อมูล...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 1. ตรวจสอบการล็อกอิน (ถ้ายังไม่ล็อกอิน ให้ดีดไปหน้า index.html)
        const session = JSON.parse(localStorage.getItem('user_session'));
        
        if (!session) {
            window.location.href = "index.html";
        } else {
            // แสดงบ้านเลขที่บนป้าย Badge
            document.getElementById('houseBadge').innerText = "บ้านเลขที่: " + session.house_no;
            // เรียกฟังก์ชันดึงข้อมูลจาก JSON
            loadDashboardData(session.house_no);
        }

        // ฟังก์ชันออกจากระบบ
        function logout() {
            localStorage.removeItem('user_session');
            window.location.href = "index.html";
        }

        // 2. ดึงข้อมูลจาก dataTest.json ตามบ้านเลขที่ที่ล็อกอิน
        function loadDashboardData(targetHouseNo) {
            fetch('dataTest.json')
                .then(response => response.json())
                .then(data => {
                    // ค้นหาข้อมูลบ้านที่ตรงกับคนที่ล็อกอินเข้ามา
                    const currentUser = data.find(user => user.houseNumber === targetHouseNo);

                    if (currentUser && currentUser.vehicles) {
                        let tableContent = '';

                        // วนลูปเฉพาะยานพาหนะ
                        currentUser.vehicles.forEach(vehicle => {
                            
                            // กรองเฉพาะประเภท "Car" เท่านั้น (ข้าม Motorcycle)
                            if (vehicle.type === "Car") {
                                vehicle.timeInOut.forEach(logs => {
                                    tableContent += `
                                        <tr>
                                            <td><img src="${currentUser.profile}" width="45" height="45" class="rounded-circle border"></td>
                                            <td class="fw-bold text-dark">${vehicle.plate}</td>
                                            <td><span class="badge bg-primary">รถยนต์ (Car)</span></td>
                                            <td>${logs.date} (เข้า: ${logs.in} | ออก: ${logs.out ? logs.out : 'ยังอยู่ในโครงการ'})</td>
                                            <td><span class="badge bg-secondary">${logs.gate}</span></td>
                                        </tr>
                                    `;
                                });
                            }
                        });

                        document.getElementById('carHistoryData').innerHTML = tableContent || '<tr><td colspan="5" class="py-4 text-muted">ไม่พบประวัติการเข้า-ออกของรถยนต์</td></tr>';
                    } else {
                        document.getElementById('carHistoryData').innerHTML = '<tr><td colspan="5" class="py-4 text-muted">ไม่พบข้อมูลบ้านเลขที่นี้</td></tr>';
                    }
                })
                .catch(error => {
                    console.error('Error loading JSON:', error);
                    document.getElementById('carHistoryData').innerHTML = '<tr><td colspan="5" class="py-4 text-danger">เกิดข้อผิดพลาดในการโหลดข้อมูล</td></tr>';
                });
        }
    </script>
</body>
</html>
