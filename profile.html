<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ข้อมูลส่วนตัว - Resident Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container my-5" style="max-width: 600px;">
        <!-- ปุ่มกดกลับ ลิงก์ถูกต้องไปหน้า Dashboard -->
		<a href="dashboard.html" class="btn btn-outline-secondary">← กลับหน้าประวัติ</a>

        <div class="card border-0 shadow-sm rounded-4 p-4">
            <h4 class="fw-bold text-primary mb-4">👤 ข้อมูลส่วนตัวลูกบ้าน</h4>
            
            <div class="mb-3">
                <label class="text-muted small d-block">บ้านเลขที่</label>
                <span id="profHouse" class="fs-5 fw-bold text-dark">--</span>
            </div>
            
            <div class="mb-3">
                <label class="text-muted small d-block">ชื่อ-นามสกุล เจ้าของบ้าน</label>
                <span class="fs-6 text-dark">คุณสมชาย ใจดี</span>
            </div>

            <div class="mb-4">
                <label class="text-muted small d-block mb-2">ทะเบียนรถยนต์ที่ลงทะเบียนไว้ (เฉพาะ Car)</label>
                <ul class="list-group">
                    <li class="list-group-item d-flex justify-content-between align-items-center">
                        1กข 8888 กรุงเทพฯ
                        <span class="badge bg-primary rounded-pill">รถยนต์หลัก</span>
                    </li>
                    <li class="list-group-item d-flex justify-content-between align-items-center">
                        2กง 1234 เชียงใหม่
                        <span class="badge bg-secondary rounded-pill">รถยนต์สำรอง</span>
                    </li>
                </ul>
            </div>

            <button onclick="logout()" class="btn btn-danger w-100 py-2 rounded-3">ออกจากระบบ</button>
        </div>
    </div>

    <script>
        const session = JSON.parse(localStorage.getItem('user_session'));
        if(!session) {
            window.location.href = "index.html";
        } else {
            document.getElementById('profHouse').innerText = session.house_no;
        }

        function logout() {
            localStorage.removeItem('user_session');
            window.location.href = "index.html";
        }
    </script>
</body>
</html>
