<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ - ระบบจัดการข้อมูลลูกบ้าน</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-main: #fcf8ec;      /* สีพื้นหลังครีม */
            --navy-dark: #0f2c59;    /* สีน้ำเงินเข้ม */
        }
        
        body { 
            background-color: var(--bg-main); 
            font-family: sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }

        .login-card {
            background-color: var(--navy-dark);
            color: white;
            border-radius: 8px;
            padding: 40px 30px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            text-align: center;
        }

        .login-logo {
            width: 70px;
            margin-bottom: 15px;
            filter: brightness(0) invert(1);
        }

        .login-title {
            font-size: 1.4rem;
            font-weight: bold;
            margin-bottom: 25px;
            letter-spacing: 0.5px;
        }

        .form-control-custom {
            border-radius: 4px;
            padding: 10px 15px;
            border: 1px solid #ccc;
            margin-bottom: 15px;
        }

        .btn-custom-light {
            background-color: white;
            color: var(--navy-dark);
            border-radius: 20px;
            padding: 8px 30px;
            font-weight: bold;
            border: none;
            width: 100%;
            margin-top: 10px;
            transition: all 0.2s;
        }

        .btn-custom-light:hover {
            background-color: #e6e6e6;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <!-- โลโก้ดั้งเดิม -->
        <img src="logochicken.png" alt="Logo" class="login-logo">
        
        <!-- หัวข้อระบบจัดการข้อมูลลูกบ้าน -->
        <div class="login-title">ระบบจัดการข้อมูลลูกบ้าน</div>

        <form id="loginForm">
            <div class="text-start mb-2">
                <small>เลขที่บ้าน / บ้านเลขที่</small>
            </div>
            <input type="text" id="houseInput" class="form-control form-control-custom" placeholder="เช่น 158/1" required>

            <div class="text-start mb-2">
                <small>รหัสผ่าน</small>
            </div>
            <input type="password" id="passInput" class="form-control form-control-custom" placeholder="••••••••" required>

            <button type="submit" class="btn btn-custom-light">เข้าสู่ระบบ</button>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const houseNo = document.getElementById('houseInput').value.trim();

            // บันทึก Session เพื่อใช้อ่านข้อมูลจาก dataTest.json
            localStorage.setItem('user_session', JSON.stringify({
                house_no: houseNo
            }));

            // ล็อกอินแล้วไปยังหน้า dashboard.html
            window.location.href = "dashboard.html";
        });
    </script>
</body>
</html>
