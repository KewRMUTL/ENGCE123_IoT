<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ - ระบบลูกบ้าน</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #eef2f5; font-family: 'Kanit', sans-serif; }
        .login-card { max-width: 400px; margin: 80px auto; border-radius: 20px; border: none; box-shadow: 0 10px 25px rgba(0,0,0,0.08); }
    </style>
</head>
<body>

    <div class="container">
        <div class="card login-card p-4">
            <div class="text-center mb-4">
                <h3 class="fw-bold text-primary">🚗 Resident Portal</h3>
                <p class="text-muted small">ระบบตรวจสอบการเข้า-ออกโครงการ (สำหรับลูกบ้าน)</p>
            </div>

            <form id="loginForm">
                <div class="mb-3">
                    <label class="form-label fw-semibold">ชื่อผู้ใช้งาน / เลขที่บ้าน</label>
                    <input type="text" id="username" class="form-control" placeholder="เช่น 99/123" required>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-semibold">รหัสผ่าน</label>
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2 rounded-3 fw-bold">เข้าสู่ระบบ</button>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const user = document.getElementById('username').value;
            
            // จำลองการเก็บข้อมูล Session ลูกบ้าน (เตรียมไว้ให้เพื่อนฝั่ง Backend มาเชื่อมต่อ API)
            localStorage.setItem('user_session', JSON.stringify({
                house_no: user,
                user_id: "USR_99123",
                role: "resident"
            }));

            // ล็อกอินสำเร็จ เปลี่ยนหน้าไป Dashboard
            window.location.href = "dashboard.html";
        });
    </script>
</body>
</html>
